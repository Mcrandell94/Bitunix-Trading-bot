# Surveys free external data sources (open interest, long/short, sentiment)
# from GitHub's runners: what's reachable, and how deep the history is.
name: Probe external data
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-external-data.mjs | tee probe.txt
      - run: { echo '## External data sources'; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
