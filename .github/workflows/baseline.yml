# Baseline lock (docs/backtest/TASKS.md, T2). Run with mode=write to print a
# fresh fixture (paste it into research/baseline-2y.json on purpose); the
# default mode=check fails when the baseline no longer matches the committed
# fixture. Also runs on every push that touches strategy code.
name: Baseline check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "'check' against research/baseline-2y.json, 'write' to print a new fixture, 'audit' for the T3 fill-realism audit, 'walkforward' (T4, 36 months), 'score-lookahead' (confluence T2), 'score-diagnostics' (confluence T3+T4) 'score-stage-a' (confluence T5) or 'screen' (signal screen)"
        default: 'check'
      days:
        default: '730'
      extras:
        default: '20'
      model:
        description: "walkforward only: 'tiers' (MTF, HTF alone) or 'confluence'"
        default: 'tiers'
      min_volume:
        description: "score modes: research universe 24h quote volume floor (owner: $3M for research)"
        default: '3000000'
      min_win:
        description: "screen only: minimum win rate on both windows"
        default: '0.6'
  push:
    branches: [main]
    paths:
      - 'packages/smc/**'
      - 'packages/backtest/src/**'
      - 'packages/risk/**'
      - 'packages/signals/**'
      - 'research/baseline-2y*.json'
      - 'config/confluence.yaml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/backtest
          key: backtest-history-${{ github.run_id }}
          restore-keys: backtest-history-
      - name: Baseline
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          MODE="${{ inputs.mode || 'check' }}"
          if [ "$MODE" = "screen" ]; then
            npm run -s screen -- --months 36 --extras "${{ inputs.extras || '60' }}" --min-volume "${{ inputs.min_volume || '3000000' }}" --min-win "${{ inputs.min_win || '0.6' }}"
          elif [ "$MODE" = "score-stage-a" ]; then
            npm run -s score -- stage-a --months 36 --extras "${{ inputs.extras || '20' }}" --min-volume "${{ inputs.min_volume || '3000000' }}"
          elif [ "$MODE" = "score-diagnostics" ]; then
            npm run -s score -- diagnostics --months 36 --extras "${{ inputs.extras || '20' }}" --min-volume "${{ inputs.min_volume || '3000000' }}"
          elif [ "$MODE" = "score-lookahead" ]; then
            npm run -s score -- lookahead --samples 1000 --months 36 --extras "${{ inputs.extras || '20' }}" --min-volume "${{ inputs.min_volume || '3000000' }}"
          elif [ "$MODE" = "walkforward" ]; then
            npm run -s walkforward -- --months 36 --extras "${{ inputs.extras || '20' }}" --model "${{ inputs.model || 'tiers' }}"
          elif [ "$MODE" = "audit" ]; then
            npm run -s audit -- --days "${{ inputs.days || '730' }}" --extras "${{ inputs.extras || '20' }}"
          elif [ "$MODE" = "write" ] || [ ! -f research/baseline-2y.json ]; then
            npm run -s baseline -- --days "${{ inputs.days || '730' }}" --extras "${{ inputs.extras || '20' }}" --write baseline-2y.json
          else
            npm run -s baseline -- --check research/baseline-2y.json
            npm run -s baseline -- --check research/baseline-2y-realism.json
          fi
      - name: Summary
        if: always()
        run: |
          { echo '## Baseline'; echo '```'; cat screen-report.txt 2>/dev/null || cat score-report.txt 2>/dev/null || cat walkforward-report.txt 2>/dev/null || cat audit-report.txt 2>/dev/null || cat baseline-2y.json 2>/dev/null || echo 'checked against research/baseline-2y.json'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline
          path: |
            baseline-2y.json
            audit-report.txt
            audit-losses.csv
            walkforward-report.txt
            walkforward-results.json
            score-report.txt
            score-diagnostics.json
            stage-a-results.json
            screen-report.txt
            screen-results.json
            research/runs.jsonl
          if-no-files-found: ignore
