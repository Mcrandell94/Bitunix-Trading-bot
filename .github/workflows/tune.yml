# Tunes the strategy on GitHub's machines: Actions → Tune → Run workflow.
# Trains on the earlier part of the window, checks on the last `test_days`,
# and puts the report on the run's summary page.
name: Tune

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of history (train + test)
        default: '365'
      test_days:
        description: Most recent days held out for testing
        default: '120'
      extras:
        description: Extra symbols (most liquid first) besides BTC/ETH/XRP
        default: '10'

permissions:
  contents: read

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same history cache as the Backtest workflow.
      - uses: actions/cache@v4
        with:
          path: .cache/backtest
          key: backtest-history-${{ github.run_id }}
          restore-keys: backtest-history-
      - name: Tune
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run -s tune -- --days "${{ inputs.days }}" --test-days "${{ inputs.test_days }}" --extras "${{ inputs.extras }}" > tune.txt 2>&1
      - name: Write the summary page
        if: always()
        run: |
          {
            echo '## Tuning'
            echo '```'
            if [ -f tune-report.txt ]; then cat tune-report.txt; else tail -n 40 tune.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat tune.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tune-results
          path: |
            tune-report.txt
            tune-results.json
            tune.txt
          if-no-files-found: ignore
