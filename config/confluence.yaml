model: confluence_v1
enabled: false            # separate model; existing strategy unaffected
decision_clock: 1H

risk:
  risk_per_trade_pct: 1.0   # flat sizing during validation
  max_total_open_risk_pct: 6.0
  max_same_dir_alts: 2
  daily_loss_limit_pct: 8.0
  max_effective_leverage: 5

costs:
  maker_pct: 0.02
  taker_pct: 0.06
  stop_slippage_bps: 2
  model_funding: true

components:
  C1_trend:     {ema_len: 50, slope_lookback_bars: 10}
  C2_structure: {swings_compared: 2}
  C3_location:  {discount_max: 0.40, premium_min: 0.60}
  C4_smc_event: {lookback_bars: 6, displacement_atr: 1.2, body_ratio: 0.60}
  M1_btc_regime: {uses: C1_trend, timeframe: 1D}
  M2_rotation:  {timeframe: 4H, bullish: [leading, improving], bearish: [lagging, weakening]}
  M3_funding:   {mean_of_last: 3, long_crowded_pct: 0.03, short_crowded_pct: -0.01}

groups:
  D:   {timeframe: 1D,  components: [C1_trend, C2_structure, C3_location]}
  H4:  {timeframe: 4H,  components: [C1_trend, C2_structure, C3_location, C4_smc_event]}
  H1:  {timeframe: 1H,  components: [C2_structure, C4_smc_event]}
  M15: {timeframe: 15m, components: [C4_smc_event]}
  MKT: {timeframe: market, components: [M1_btc_regime, M2_rotation, M3_funding]}

weights:
  active: A2
  A1: {D: 0.20, H4: 0.20, H1: 0.20, M15: 0.20, MKT: 0.20}
  A2: {D: 0.30, H4: 0.30, H1: 0.20, M15: 0.05, MKT: 0.15}

entry:
  mode: X                  # X = score gate + existing 1H setup; Y = score cross
  t_entry: 50
  t_reset: 25
  grid: {t_entry: [40, 50, 60, 70]}
  mode_X: {expiry_bars: 8, cancel_on_1R_touch: true, cancel_on_fvg_close_through: true}
  mode_Y: {limit_offset_atr: 0.25, expiry_bars: 4, stop_atr: 1.5, swing_buffer_atr: 0.1}

vetoes:
  max_cost_ratio: 0.15
  funding_blackout_min: 15
  one_position_per_coin: true
  portfolio_caps_enabled: true

exits:
  partials: [{at_R: 1.0, frac: 0.3333}, {at_R: 2.0, frac: 0.3333}]
  stop_at_1R_R: -0.5
  stop_at_2R_offset_pct: 0.1
  chandelier: {activate_R: 2.0, atr_tf: 4H, atr_len: 22, mult: 3.0}
  cap_R: 8
  time_stop: {min_mfe_R: 1.0, check_bars_1h: 48, max_bars_1h: 240}
  score_exit: {enabled: false, level: 0}

stage_b:
  enabled: false
  candidate_min_abs_score: 20
  label: hit_1R_before_minus_1R
  model: logistic_l2
  inner_cv_folds: 5
  p_margin: 0.03
  adopt_if_folds_won: 6

sizing:
  score_scaled: {enabled: false, r_min_pct: 0.5, r_max_pct: 1.5}

validation:
  walk_forward: {train_months: 12, test_months: 3, step_months: 3}
  holdout_months: 6
  min_trades: {train: 100, oos_block: 50}
  score_buckets: [20, 40, 60, 80, 100]
  monotonic_folds_required: 6
  ablation_folds_to_remove: 5
  redundancy_max_abs_corr: 0.7
  sign_flip_folds_max: 2
  null_runs: 500
  shuffled_score_runs: 500
  mc_resamples: 10000
  mc_dd95_max_pct: 25
